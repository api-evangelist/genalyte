aid: genalyte
name: Genalyte
description: 'Genalyte, Inc. is a San Diego, California in-vitro diagnostics company building
  point-of-care blood testing systems based on silicon photonic microring resonator technology.
  Founded by Cary Gunn, the company developed the Maverick Diagnostic System and its successor
  Merlin, an automated benchtop analyzer that runs hematology, chemistry and immunoassay panels
  — including CBC, lipid panel and comprehensive metabolic panel — from small whole-blood or
  serum volumes and returns results in roughly twenty to thirty minutes while the patient is
  still in the clinic. A cloud verification layer the company markets as CloudLab quality-checks
  results and routes them into electronic medical record systems. Genalyte received FDA clearance
  for a thyroid stimulating hormone immunoassay performed on a silicon chip and previously held
  an FDA Emergency Use Authorization for a rapid COVID-19 antibody test. The company is
  investor-backed (Khosla Ventures, Verily Life Sciences and others) and is a HIPAA covered
  entity that publishes a Notice of Privacy Practices. As of this profile Genalyte publishes no
  public developer portal, API documentation, or machine-readable API specification.'
